<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1120">
<meta name="mobile-web-app-capable" content="yes">
<title>My Routine</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f4fa;--card:#fff;--tx:#1b1f3a;--mu:#626892;--ln:#e3e5f2;--hd:rgba(243,244,250,.9);--sh:0 4px 18px rgba(30,40,90,.08);--ac:#6c7bff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--card:#181c33;--tx:#eef0ff;--mu:#9ba2c8;--ln:#262b4a;--hd:rgba(14,17,32,.9);--sh:0 4px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--card:#181c33;--tx:#eef0ff;--mu:#9ba2c8;--ln:#262b4a;--hd:rgba(14,17,32,.9);--sh:0 4px 18px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10;backdrop-filter:blur(12px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);backdrop-filter:blur(12px);padding:12px 16px 8px}
.top{display:flex;justify-content:space-between;align-items:center}
.date{font-size:12px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.ic{border:0;background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:14px;font-size:20px;box-shadow:var(--sh)}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;border:0;background:transparent;color:var(--mu);padding:8px 0;border-radius:14px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tab span{font-size:16px;font-weight:700;color:var(--tx)}
.tab.sel{background:var(--ac);color:#fff}.tab.sel span{color:#fff}
.tab.today::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ac);position:absolute;bottom:2px}
.tab.sel.today::after{background:#fff}
main{padding:8px 16px}
.hero{background:linear-gradient(135deg,#5b6cff,#9a6bff);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.big{font-size:22px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.sub{font-size:13px;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 12px 12px 0;margin-bottom:10px;box-shadow:var(--sh);border:2px solid transparent;overflow:hidden}
.card.now{border-color:var(--ac)}
.card.done .tt{text-decoration:line-through;opacity:.5}
.cb{width:6px;align-self:stretch;border-radius:0 6px 6px 0;flex:none}
.bd{flex:1;min-width:0}
.tm{font-size:12px;color:var(--mu)}
.tt{font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;margin-top:3px;padding:1px 8px;border-radius:99px;background:var(--ln);color:var(--mu)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);background:transparent;color:#fff;font-size:15px;flex:none;padding:0}
.done .chk{background:#34c98a;border-color:#34c98a}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(108,123,255,.5);z-index:8}
.ov{position:fixed;inset:0;background:rgba(5,8,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
textarea{height:140px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;gap:10px}.row label{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:2px solid var(--ln);background:transparent;color:var(--tx);padding:5px 10px;border-radius:99px;font:inherit;font-size:12px}
.chip.on{color:#fff;border-color:transparent}
.btns{display:flex;gap:8px;margin-top:6px}
.btns button,.mb{flex:1;padding:12px;border-radius:14px;border:0;font:inherit;font-weight:600;background:var(--ln);color:var(--tx)}
.btns .pri{background:var(--ac);color:#fff}.btns .danger{background:#ff5d6c22;color:#ff5d6c;flex:.8}
.mb{display:block;width:100%;margin-bottom:8px;text-align:left}
#err{color:#ff5d6c;font-size:13px;min-height:18px}
</style>
</head>
<body>
<header>
  <div class="top"><div><div class="date" id="dt"></div><h1>My Routine</h1></div><button id="mn" class="ic" aria-label="Menu">⋯</button></div>
  <div class="tabs" id="tabs"></div>
</header>
<main><section id="hero" class="hero"></section><div id="list"></div></main>
<button id="fab" class="fab" aria-label="Add block">+</button>

<div class="ov" id="ov" hidden><div class="sheet">
  <h3 id="sh-t">Edit block</h3>
  <label>Title<input id="f-t" maxlength="60"></label>
  <div class="row"><label>Start<input id="f-s" type="time"></label><label>End<input id="f-e" type="time"></label></div>
  <div class="chips" id="f-c"></div>
  <label>Apply to<select id="f-sc"><option value="d">This day only</option><option value="a">Every day (same block)</option></select></label>
  <div id="err"></div>
  <div class="btns"><button id="b-del" class="danger">Delete</button><button id="b-x">Cancel</button><button id="b-ok" class="pri">Save</button></div>
</div></div>

<div class="ov" id="mo" hidden><div class="sheet">
  <h3>Menu</h3>
  <button class="mb" id="m-reset">↺ Reset to default schedule</button>
  <button class="mb" id="m-clear">☐ Clear today’s ticks</button>
  <label>Backup / restore (copy this text, or paste a backup and tap Load)<textarea id="m-ta" spellcheck="false"></textarea></label>
  <div class="btns"><button id="m-copy">Copy</button><button id="m-load">Load</button><button id="m-x" class="pri">Close</button></div>
  <div id="m-msg" style="font-size:13px;color:var(--mu);margin-top:8px;min-height:18px"></div>
</div></div>

<script>
const CATS={rest:["Rest","#8b93b8","🌙"],meal:["Meal","#ffb454","🍽️"],gym:["Gym","#ff6b6b","🏋️"],class:["Class","#5aa9ff","🎓"],study:["Study","#4fd18b","📖"],proj:["Project","#2ed3c6","🛠️"],intern:["Internship","#c18bff","💼"],free:["Free","#ffd84d","🎮"]};
const FD=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],SD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WK=["06:30-07:30|Wake, freshen, walk|rest","07:30-08:00|Breakfast|meal"];
const EVE=["17:30-18:30|Free: walk, sport, games|free","18:30-19:30|Dinner + break|meal"];
const END=["21:30-22:30|Internship / skill prep|intern","22:30-23:00|Plan tomorrow, wind down|rest"];
const GYM=["08:00-09:00|Pre-gym: light recap|rest","09:00-10:30|GYM: upper body|gym","10:30-11:30|Shower, snack, rest|rest"];
const DEF=[
[...WK,...GYM,"11:30-12:00|Prep for Dyn & Vib|study","12:00-13:00|CLASS Dyn & Vib|class","13:00-14:30|Lunch + rest|meal","14:30-16:00|CLASS Adv Mech of Solids|class","16:00-17:30|CLASS FEM|class",...EVE,"19:30-21:30|DEEP STUDY: derive today’s topics|study",...END],
[...WK,"08:00-09:00|Recap notes, go to class|study","09:00-10:00|CLASS Dyn & Vib|class","10:00-11:00|Dyn & Vib: derive + problems|study","11:00-12:00|CLASS Math Methods|class","12:00-13:00|Math Methods problems|study","13:00-14:30|Lunch + rest|meal","14:30-17:30|LAB Data Acq & Control|class",...EVE,"19:30-21:30|DEEP STUDY: assignments (FEM / AMS)|study",...END],
[...WK,...GYM,"11:30-13:00|FEM / AMS: derive from scratch|study","13:00-14:30|Lunch + rest|meal","14:30-16:00|CLASS Math Methods|class","16:00-17:30|PROJECT: isolator / assignment|proj",...EVE,"19:30-21:30|DEEP STUDY: today’s topics + problems|study",...END],
[...WK,"08:00-09:00|Recap notes|study","09:00-12:00|DEEP STUDY: FEM assignment / report|study","12:00-13:00|Vibrations problems|study","13:00-14:30|Lunch + rest|meal","14:30-16:00|CLASS FEM|class","16:00-17:30|CLASS Adv Mech of Solids|class",...EVE,"19:30-21:30|DEEP STUDY: today’s topics|study",...END],
[...WK,"08:00-09:00|Recap notes|study","09:00-10:00|First-principles reading|study","10:00-11:00|CLASS Math Methods|class","11:00-12:00|CLASS Dyn & Vib|class","12:00-13:00|Weekly problem practice|study","13:00-14:30|Lunch + rest|meal","14:30-17:30|PROJECT: isolator / assignment|proj",...EVE,"19:30-22:30|FRIDAY OFF: games, friends, fun|free","22:30-23:00|Wind down|rest"],
["06:30-07:00|Sleep in|rest","07:00-07:30|Wake, freshen|rest","07:30-08:00|Breakfast|meal","08:00-09:00|Rest / get ready|rest","09:00-10:30|GYM: upper body|gym","10:30-11:30|Shower, snack, rest|rest","11:30-13:00|ASSIGNMENT block|study","13:00-14:30|Lunch + rest|meal","14:30-17:30|PROJECT block (3 h)|proj","17:30-19:00|Free: sport / friends|free","19:00-20:00|Dinner|meal","20:00-22:00|Free: games / movie|free","22:00-23:00|Call family, wind down|rest"],
["06:30-07:30|Sleep in|rest","07:30-08:00|Breakfast|meal","08:00-10:00|Rest, chores, laundry|rest","10:00-12:00|FIRST-PRINCIPLES DIVE: 1 topic per course|study","12:00-13:00|Free|free","13:00-14:30|Lunch + rest|meal","14:30-16:30|INTERNSHIP prep: resume, GD, tech Qs|intern","16:30-18:00|Weekly review + plan the week|study","18:00-19:00|Walk / sport|free","19:00-20:00|Dinner|meal","20:00-21:30|Free / call family|free","21:30-23:00|Pack bag, wind down|rest"]];
const P=a=>a.map(x=>{const[r,t,c]=x.split("|"),[s,e]=r.split("-");return{s,e,t,c}});
const $=s=>document.querySelector(s),m=t=>{const[a,b]=t.split(":");return+a*60+ +b},pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=t=>{let[h,i]=t.split(":").map(Number);const a=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(i)+" "+a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=n=>{n=Math.max(0,Math.round(n));const h=Math.floor(n/60),i=n%60;return h?h+"h"+(i?" "+i+"m":""):i+"m"};
const KEY="routine.v1";let S,sel,cur=[],ed=null,ecat="study",first=true;
const ti=(new Date().getDay()+6)%7;sel=ti;
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||"null");if(j&&Array.isArray(j.days)&&j.days.length==7){S=j;S.done=S.done||{};return}}catch(e){}S={days:DEF.map(P),done:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dateOf(d){const x=new Date();x.setDate(x.getDate()-(ti-d));return x}
function prune(){const lim=new Date();lim.setDate(lim.getDate()-30);const l=iso(lim);for(const k in S.done)if(k<l)delete S.done[k]}
const bk=b=>b.s+"|"+b.t;
function render(){
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),date=dateOf(sel),dk=iso(date);
  $("#dt").textContent=now.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  $("#tabs").innerHTML=SD.map((n,i)=>`<button class="tab${i==sel?" sel":""}${i==ti?" today":""}" data-d="${i}">${n}<span>${dateOf(i).getDate()}</span></button>`).join("");
  cur=[...S.days[sel]].sort((a,b)=>m(a.s)-m(b.s));
  const dn=S.done[dk]||{},nd=cur.filter(b=>dn[bk(b)]).length,pc=cur.length?Math.round(nd/cur.length*100):0;
  const focus=cur.filter(b=>["study","proj","intern","class"].includes(b.c)).reduce((a,b)=>a+m(b.e)-m(b.s),0);
  let h;
  if(sel==ti){
    const c=cur.find(b=>m(b.s)<=nm&&nm<m(b.e)),nx=cur.find(b=>m(b.s)>nm);
    if(c)h=`<div class="lab">Now</div><div class="big">${CATS[c.c][2]} ${esc(c.t)}</div><div class="sub">${dur(m(c.e)-nm)} left${nx?" · Next: "+esc(nx.t):""}</div>`;
    else h=`<div class="lab">${nx?"Up next":"Off the clock"}</div><div class="big">${nx?CATS[nx.c][2]+" "+esc(nx.t):"🌙 Rest well"}</div><div class="sub">${nx?"Starts in "+dur(m(nx.s)-nm):"Tomorrow is a fresh start"}</div>`;
  }else h=`<div class="lab">${date.toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div><div class="big">${FD[sel]}</div><div class="sub">${dur(focus)} of classes and focused work</div>`;
  h+=`<div class="sub" style="margin-top:10px">Done ${nd} of ${cur.length}</div><div class="bar"><i style="width:${pc}%"></i></div>`;
  $("#hero").innerHTML=h;
  $("#list").innerHTML=cur.length?cur.map((b,i)=>{const C=CATS[b.c]||CATS.free,isNow=sel==ti&&m(b.s)<=nm&&nm<m(b.e);
    return `<div class="card${isNow?" now":""}${dn[bk(b)]?" done":""}" data-i="${i}"><div class="cb" style="background:${C[1]}"></div><div class="bd"><div class="tm">${fmt(b.s)} – ${fmt(b.e)}</div><div class="tt">${esc(b.t)}</div><span class="tag">${C[2]} ${C[0]}</span></div><button class="chk" data-i="${i}" aria-label="Mark done">${dn[bk(b)]?"✓":""}</button></div>`}).join(""):`<div class="empty">Nothing planned. Tap + to add a block.</div>`;
  if(first&&sel==ti){first=false;const n=$(".card.now");if(n)n.scrollIntoView({block:"center"})}
}
function chips(){$("#f-c").innerHTML=Object.keys(CATS).map(k=>`<button type="button" class="chip${k==ecat?" on":""}" data-k="${k}" style="${k==ecat?"background:"+CATS[k][1]:""}">${CATS[k][2]} ${CATS[k][0]}</button>`).join("")}
function openEd(b){
  ed={o:b||null};ecat=b?b.c:"study";
  $("#sh-t").textContent=b?"Edit block":"New block";
  $("#f-t").value=b?b.t:"";$("#f-s").value=b?b.s:"09:00";$("#f-e").value=b?b.e:"10:00";
  $("#f-sc").value="d";$("#err").textContent="";$("#b-del").style.display=b?"":"none";
  chips();$("#ov").hidden=false;
}
const same=(x,o)=>x.s==o.s&&x.e==o.e&&x.t==o.t;
function targets(){return $("#f-sc").value=="a"?[0,1,2,3,4,5,6]:[sel]}
$("#b-ok").onclick=()=>{
  const t=$("#f-t").value.trim(),s=$("#f-s").value,e=$("#f-e").value;
  if(!t)return $("#err").textContent="Give it a title.";
  if(!s||!e||m(e)<=m(s))return $("#err").textContent="End time must be after start time.";
  const nb={s,e,t,c:ecat};
  targets().forEach(d=>{
    if(!ed.o)S.days[d].push({...nb});
    else{const i=S.days[d].findIndex(x=>same(x,ed.o));if(i>=0)S.days[d][i]={...nb};else if(d==sel)S.days[d].push({...nb})}
  });
  save();$("#ov").hidden=true;render();
};
$("#b-del").onclick=()=>{targets().forEach(d=>{S.days[d]=S.days[d].filter(x=>!same(x,ed.o))});save();$("#ov").hidden=true;render()};
$("#b-x").onclick=()=>{$("#ov").hidden=true};
$("#ov").onclick=e=>{if(e.target.id=="ov")$("#ov").hidden=true};
$("#f-c").onclick=e=>{const b=e.target.closest(".chip");if(b){ecat=b.dataset.k;chips()}};
$("#fab").onclick=()=>openEd(null);
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){sel=+b.dataset.d;render();window.scrollTo(0,0)}};
$("#list").onclick=e=>{
  const c=e.target.closest(".chk");
  if(c){const b=cur[+c.dataset.i],dk=iso(dateOf(sel));S.done[dk]=S.done[dk]||{};if(S.done[dk][bk(b)])delete S.done[dk][bk(b)];else S.done[dk][bk(b)]=1;save();render();return}
  const d=e.target.closest(".card");if(d)openEd(cur[+d.dataset.i]);
};
let rc=false;
function menu(){$("#m-ta").value=JSON.stringify({days:S.days});$("#m-msg").textContent="";$("#m-reset").textContent="↺ Reset to default schedule";rc=false;$("#mo").hidden=false}
$("#mn").onclick=menu;$("#m-x").onclick=()=>{$("#mo").hidden=true};
$("#mo").onclick=e=>{if(e.target.id=="mo")$("#mo").hidden=true};
$("#m-reset").onclick=()=>{
  if(!rc){rc=true;$("#m-reset").textContent="Tap again to confirm reset";return}
  S.days=DEF.map(P);save();$("#mo").hidden=true;render();
};
$("#m-clear").onclick=()=>{delete S.done[iso(dateOf(sel))];save();$("#m-msg").textContent="Ticks cleared for this day.";render()};
$("#m-copy").onclick=()=>{const t=$("#m-ta");t.select();try{navigator.clipboard.writeText(t.value).then(()=>{$("#m-msg").textContent="Copied."},()=>{$("#m-msg").textContent="Select the text and copy it manually."})}catch(e){$("#m-msg").textContent="Select the text and copy it manually."}};
$("#m-load").onclick=()=>{
  try{const j=JSON.parse($("#m-ta").value);
    if(!j||!Array.isArray(j.days)||j.days.length!=7||!j.days.every(d=>Array.isArray(d)&&d.every(b=>b&&typeof b.s=="string"&&typeof b.e=="string"&&typeof b.t=="string"&&CATS[b.c])))throw 0;
    S.days=j.days.map(d=>d.map(b=>({s:b.s,e:b.e,t:String(b.t).slice(0,60),c:b.c})));save();render();$("#m-msg").textContent="Backup loaded."}
  catch(e){$("#m-msg").textContent="That does not look like a valid backup."}
};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
load();prune();save();render();
setInterval(render,30000);
</script>
</body>
</html>
